version: '3'

vars:
  PODMAN_COMPOSE: podman compose
  TFE_ENV_FILE: platform/tfe/.env
  TFE_COMPOSE_FILE: platform/tfe/podman-compose.yml

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  help:
    desc: Show detailed help for all available tasks
    cmds:
      - |
        printf '%s\n' \
          'TFE Load Testing Framework - Available tasks:' \
          '  task check-prereqs     # verify required local tools are installed' \
          '  task check-tfe-env     # verify the local TFE env file and Podman socket' \
          '  task detect-host-alias-ip # detect the correct TFE_HOST_ALIAS_IP value for your system' \
          '  task podman-socket     # print the detected local Podman API socket path' \
          '  task podman-machine-allow-443 # lower the Podman machine port threshold so host 443 can be published' \
          '  task generate-certs    # create self-signed TLS certs for tfe.localdemo.me' \
          '  task tfe:up            # start the local TFE, Postgres, and MinIO stack' \
          '  task tfe:down          # stop the local TFE stack' \
          '  task tfe:logs          # tail service logs from the local TFE stack' \
          '  task tfe:health        # run the built-in Terraform Enterprise health check' \
          '  task tfe:restart       # restart the TFE stack'

  check-prereqs:
    desc: Verify required local tools are installed
    cmds:
      - ./scripts/check-prereqs.sh

  check-tfe-env:
    desc: Verify the local TFE env file and Podman socket
    cmds:
      - |
        test -f "{{.TFE_ENV_FILE}}" || { printf 'missing %s; copy platform/tfe/.env.example to platform/tfe/.env\n' "{{.TFE_ENV_FILE}}" >&2; exit 1; }
        set -a; . "{{.TFE_ENV_FILE}}"; set +a
        test -n "$TFE_LICENSE" || { printf 'TFE_LICENSE is not set in %s\n' "{{.TFE_ENV_FILE}}" >&2; exit 1; }
        test -n "$TFE_ENCRYPTION_PASSWORD" || { printf 'TFE_ENCRYPTION_PASSWORD is not set in %s\n' "{{.TFE_ENV_FILE}}" >&2; exit 1; }
        test -n "$PODMAN_SOCKET" || { printf 'PODMAN_SOCKET is not set in %s\n' "{{.TFE_ENV_FILE}}" >&2; exit 1; }
        tfe_https_port="${TFE_HTTPS_PORT:-443}"
        case "$tfe_https_port" in
          ''|*[!0-9]*) printf 'TFE_HTTPS_PORT must be a numeric host port in %s\n' "{{.TFE_ENV_FILE}}" >&2; exit 1 ;;
        esac
        active_socket="$(podman info --format '{{.Host.RemoteSocket.Path}}' 2>/dev/null | sed 's|^unix://||' || true)"
        detected_rootful_socket="$(podman machine ssh 'if sudo test -S /run/podman/podman.sock; then printf "/run/podman/podman.sock\n"; fi' 2>/dev/null || true)"
        detected_rootless_socket="$(podman machine ssh 'guest_socket="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock"; if ! test -S "$guest_socket"; then systemctl --user start podman.socket >/dev/null 2>&1 || true; fi; if test -S "$guest_socket"; then printf "%s\n" "$guest_socket"; fi' 2>/dev/null || true)"
        detected_host_socket="$(podman machine inspect --format '{{.ConnectionInfo.PodmanSocket.Path}}' 2>/dev/null || true)"
        active_rootless="$(podman info --format '{{.Host.Security.Rootless}}' 2>/dev/null || true)"
        detected_guest_socket="$detected_rootful_socket"
        if [ -z "$detected_guest_socket" ]; then
          detected_guest_socket="$detected_rootless_socket"
        fi
        if [ -n "$detected_host_socket" ] && [ "$PODMAN_SOCKET" = "$detected_host_socket" ]; then
          printf 'PODMAN_SOCKET points to the macOS host-side Podman machine socket at %s\n' "$PODMAN_SOCKET" >&2
          printf 'That socket exists, but Podman cannot bind-mount it into the TFE container.\n' >&2
          if [ -n "$active_socket" ]; then
            printf 'Set PODMAN_SOCKET=%s in %s and retry.\n' "$active_socket" "{{.TFE_ENV_FILE}}" >&2
          elif [ -n "$detected_guest_socket" ]; then
            printf 'Set PODMAN_SOCKET=%s in %s and retry.\n' "$detected_guest_socket" "{{.TFE_ENV_FILE}}" >&2
          else
            printf 'Run `task podman-socket` to print a guest-side socket path and retry.\n' >&2
          fi
          exit 1
        fi
        if [ -n "$active_socket" ] && [ "$PODMAN_SOCKET" != "$active_socket" ]; then
          printf 'PODMAN_SOCKET=%s does not match the active Podman connection socket %s\n' "$PODMAN_SOCKET" "$active_socket" >&2
          printf 'Set PODMAN_SOCKET=%s in %s, or switch Podman connections and rerun `task podman-socket`.\n' "$active_socket" "{{.TFE_ENV_FILE}}" >&2
          exit 1
        fi
        socket_ok=0
        if [ -n "$active_socket" ] && [ "$PODMAN_SOCKET" = "$active_socket" ]; then
          socket_ok=1
        elif [ -n "$detected_guest_socket" ] && [ "$PODMAN_SOCKET" = "$detected_guest_socket" ]; then
          socket_ok=1
        elif test -S "$PODMAN_SOCKET"; then
          socket_ok=1
        elif podman machine ssh "test -S '$PODMAN_SOCKET'" >/dev/null 2>&1; then
          socket_ok=1
        fi
        if [ "$socket_ok" -ne 1 ]; then
          printf 'Podman socket not found at %s\n' "$PODMAN_SOCKET" >&2
          if [ -n "$detected_guest_socket" ]; then
            printf 'For Podman machine on macOS, set PODMAN_SOCKET=%s in %s and retry.\n' "$detected_guest_socket" "{{.TFE_ENV_FILE}}" >&2
          elif [ -n "$detected_host_socket" ]; then
            printf 'Podman machine reported a host-side socket at %s, but that path is not mountable into containers.\n' "$detected_host_socket" >&2
            printf 'Run `task podman-socket` to print a guest-side socket path that TFE can use.\n' >&2
          else
            printf 'If you want a fixed local socket path, start one with:\n' >&2
            printf '  podman system service --time=0 unix:///tmp/podman.sock\n' >&2
          fi
          exit 1
        fi
        if [ "$active_rootless" = "true" ]; then
          printf 'The active Podman connection is rootless (%s).\n' "$active_socket" >&2
          printf 'Terraform Enterprise bundles Vault, and rootless Podman cannot grant the memlock limit Vault needs to boot.\n' >&2
          if [ -n "$detected_rootful_socket" ]; then
            printf 'Switch Podman to a rootful connection, set PODMAN_SOCKET=%s in %s, and rerun `task tfe:up`.\n' "$detected_rootful_socket" "{{.TFE_ENV_FILE}}" >&2
            printf 'Use `podman system connection list` to find the rootful connection for your machine.\n' >&2
          else
            printf 'Use a rootful Podman service/socket for this demo instead of a rootless connection.\n' >&2
          fi
          exit 1
        fi
        if [ -n "$detected_guest_socket" ] || [ -n "$detected_host_socket" ]; then
          unprivileged_port_start="$(podman machine ssh 'sysctl -n net.ipv4.ip_unprivileged_port_start' 2>/dev/null || true)"
          if [ -n "$unprivileged_port_start" ] && [ "$tfe_https_port" -lt 1024 ] && [ "$unprivileged_port_start" -gt "$tfe_https_port" ]; then
            printf 'Rootless Podman machine cannot publish host port %s because net.ipv4.ip_unprivileged_port_start is %s.\n' "$tfe_https_port" "$unprivileged_port_start" >&2
            printf 'Run `task podman-machine-allow-443` to lower the threshold inside the Podman machine, or set TFE_HTTPS_PORT=8443 in %s if you need an unprivileged fallback.\n' "{{.TFE_ENV_FILE}}" >&2
            exit 1
          fi
        fi
        exit 0

  podman-socket:
    desc: Print the detected local Podman API socket path
    cmds:
      - |
        active_socket="$(podman info --format '{{.Host.RemoteSocket.Path}}' 2>/dev/null | sed 's|^unix://||' || true)"
        detected_rootful_socket="$(podman machine ssh 'if sudo test -S /run/podman/podman.sock; then printf "/run/podman/podman.sock\n"; fi' 2>/dev/null || true)"
        detected_rootless_socket="$(podman machine ssh 'guest_socket="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock"; if ! test -S "$guest_socket"; then systemctl --user start podman.socket >/dev/null 2>&1 || true; fi; if test -S "$guest_socket"; then printf "%s\n" "$guest_socket"; fi' 2>/dev/null || true)"
        detected_guest_socket="$detected_rootful_socket"
        if [ -z "$detected_guest_socket" ]; then
          detected_guest_socket="$detected_rootless_socket"
        fi
        if [ -n "$active_socket" ]; then
          printf '%s\n' "$active_socket"
        elif [ -n "$detected_guest_socket" ]; then
          printf '%s\n' "$detected_guest_socket"
        elif test -S /tmp/podman.sock; then
          printf '%s\n' /tmp/podman.sock
        else
          detected_host_socket="$(podman machine inspect --format '{{.ConnectionInfo.PodmanSocket.Path}}' 2>/dev/null || true)"
          printf 'Unable to determine a live Podman socket path.\n' >&2
          if [ -n "$detected_host_socket" ]; then
            printf 'Podman machine reported a host-side socket at %s, but that path is not mountable into containers.\n' "$detected_host_socket" >&2
            printf 'Start Podman and rerun `task podman-socket`; it should print the guest-side socket for the active connection.\n' >&2
          else
            printf 'On macOS, start Podman and rerun: task podman-socket\n' >&2
            printf 'On Linux, you can expose /tmp/podman.sock with: podman system service --time=0 unix:///tmp/podman.sock\n' >&2
          fi
          exit 1
        fi

  podman-machine-allow-443:
    desc: Lower the Podman machine port threshold so host 443 can be published
    cmds:
      - |
        threshold="$(podman machine ssh 'sysctl -n net.ipv4.ip_unprivileged_port_start' 2>/dev/null || true)"
        test -n "$threshold" || { printf 'Unable to read net.ipv4.ip_unprivileged_port_start from the active Podman machine.\n' >&2; printf 'Start Podman machine and make sure the active Podman connection points to it, then retry.\n' >&2; exit 1; }
        if [ "$threshold" -le 443 ]; then
          printf 'Podman machine already allows host port 443 (net.ipv4.ip_unprivileged_port_start=%s).\n' "$threshold"
        else
          podman machine ssh "sudo install -d /etc/sysctl.d >/dev/null 2>&1 && printf 'net.ipv4.ip_unprivileged_port_start=443\n' | sudo tee /etc/sysctl.d/60-tfe-demo-unprivileged-port-443.conf >/dev/null && sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443 >/dev/null"
          updated_threshold="$(podman machine ssh 'sysctl -n net.ipv4.ip_unprivileged_port_start' 2>/dev/null || true)"
          if [ -z "$updated_threshold" ] || [ "$updated_threshold" -gt 443 ]; then
            printf 'Failed to lower net.ipv4.ip_unprivileged_port_start; current value is %s\n' "$updated_threshold" >&2
            exit 1
          fi
          printf 'Podman machine now allows host port 443 (net.ipv4.ip_unprivileged_port_start=%s).\n' "$updated_threshold"
        fi

  generate-certs:
    desc: Create self-signed TLS certs for tfe.localdemo.me
    cmds:
      - ./scripts/generate-dev-certs.sh

  tfe:up:
    desc: Start the local TFE, Postgres, and MinIO stack
    deps:
      - check-tfe-env
    cmds:
      - "{{.PODMAN_COMPOSE}} --env-file {{.TFE_ENV_FILE}} -f {{.TFE_COMPOSE_FILE}} up -d"

  tfe:down:
    desc: Stop the local TFE stack
    deps:
      - check-tfe-env
    cmds:
      - "{{.PODMAN_COMPOSE}} --env-file {{.TFE_ENV_FILE}} -f {{.TFE_COMPOSE_FILE}} down"

  tfe:restart:
    desc: Restart the TFE stack
    deps:
      - check-tfe-env
    cmds:
      - "{{.PODMAN_COMPOSE}} --env-file {{.TFE_ENV_FILE}} -f {{.TFE_COMPOSE_FILE}} restart"

  tfe:logs:
    desc: Tail service logs from the local TFE stack
    deps:
      - check-tfe-env
    cmds:
      - "{{.PODMAN_COMPOSE}} --env-file {{.TFE_ENV_FILE}} -f {{.TFE_COMPOSE_FILE}} logs -f tfe postgres minio"

  tfe:health:
    desc: Run the built-in Terraform Enterprise health check
    deps:
      - check-tfe-env
    cmds:
      - "{{.PODMAN_COMPOSE}} --env-file {{.TFE_ENV_FILE}} -f {{.TFE_COMPOSE_FILE}} exec tfe tfe-health-check-status"

  monitoring:open:
    desc: Open monitoring dashboards in browser
    cmds:
      - |
        printf 'Opening monitoring dashboards...\n'
        printf 'Grafana: http://localhost:3000 (admin/admin)\n'
        printf 'Prometheus: http://localhost:9090\n'
        printf 'TFE Exporter: http://localhost:9101/metrics\n'
        printf 'PostgreSQL Exporter: http://localhost:9187/metrics\n'
        open http://localhost:3000 2>/dev/null || xdg-open http://localhost:3000 2>/dev/null || printf 'Please open http://localhost:3000 manually\n'

  monitoring:logs:
    desc: View logs from monitoring services
    deps:
      - check-tfe-env
    cmds:
      - "{{.PODMAN_COMPOSE}} --env-file {{.TFE_ENV_FILE}} -f {{.TFE_COMPOSE_FILE}} logs -f prometheus grafana tfe-exporter postgres-exporter cadvisor"

  monitoring:restart:
    desc: Restart monitoring services (Grafana, Prometheus, exporters)
    deps:
      - check-tfe-env
    cmds:
      - "{{.PODMAN_COMPOSE}} --env-file {{.TFE_ENV_FILE}} -f {{.TFE_COMPOSE_FILE}} restart grafana prometheus tfe-exporter postgres-exporter cadvisor"

  grafana:restart:
    desc: Restart only Grafana (useful after dashboard changes)
    deps:
      - check-tfe-env
    cmds:
      - "{{.PODMAN_COMPOSE}} --env-file {{.TFE_ENV_FILE}} -f {{.TFE_COMPOSE_FILE}} restart grafana"
      - printf 'Grafana restarted. Access at http://localhost:3000\n'

  detect-host-alias-ip:
    desc: Detect the correct TFE_HOST_ALIAS_IP value for your system
    cmds:
      - |
        printf 'Detecting correct TFE_HOST_ALIAS_IP value...\n'
        if command -v podman >/dev/null 2>&1; then
          if podman machine list 2>/dev/null | grep -q "Currently running"; then
            printf 'Detected macOS Podman machine\n'
            IP=$(podman machine ssh "ip addr show host0 2>/dev/null | grep 'inet ' | awk '{print \$2}' | cut -d/ -f1" 2>/dev/null || echo "192.168.127.254")
            printf 'Recommended TFE_HOST_ALIAS_IP: %s\n' "$IP"
          else
            printf 'Detected Linux or non-machine Podman\n'
            IP=$(podman network inspect podman 2>/dev/null | grep -oE '"gateway":\s*"[0-9.]+"' | grep -oE '[0-9.]+' | head -1 || echo "10.88.0.1")
            printf 'Recommended TFE_HOST_ALIAS_IP: %s\n' "$IP"
          fi
        else
          printf 'Podman not found. Please install Podman first.\n' >&2
          exit 1
        fi

  test:all:
    desc: Run all load tests with analysis (workspace, run, and state operations)
    cmds:
      - |
        if [ ! -f "run_all_tests.sh" ]; then
          printf 'Error: run_all_tests.sh not found\n' >&2
          exit 1
        fi
        if [ -f ".env" ]; then
          set -a
          . .env
          set +a
        fi
        if [ -f "venv/bin/activate" ]; then
          . venv/bin/activate
        fi
        chmod +x run_all_tests.sh
        MAX_CONCURRENT_RUNS="${MAX_CONCURRENT_RUNS:-20}" ./run_all_tests.sh {{.CLI_ARGS}}

  test:workspace:
    desc: Run workspace operations load test
    cmds:
      - |
        if [ ! -f "run_all_tests.sh" ]; then
          printf 'Error: run_all_tests.sh not found\n' >&2
          exit 1
        fi
        if [ -f ".env" ]; then
          set -a
          . .env
          set +a
        fi
        if [ -f "venv/bin/activate" ]; then
          . venv/bin/activate
        fi
        chmod +x run_all_tests.sh
        MAX_CONCURRENT_RUNS="${MAX_CONCURRENT_RUNS:-20}" ./run_all_tests.sh --skip-run --skip-state {{.CLI_ARGS}}

  test:run:
    desc: Run run operations load test
    cmds:
      - |
        if [ ! -f "run_all_tests.sh" ]; then
          printf 'Error: run_all_tests.sh not found\n' >&2
          exit 1
        fi
        if [ -f ".env" ]; then
          set -a
          . .env
          set +a
        fi
        if [ -f "venv/bin/activate" ]; then
          . venv/bin/activate
        fi
        chmod +x run_all_tests.sh
        MAX_CONCURRENT_RUNS="${MAX_CONCURRENT_RUNS:-20}" ./run_all_tests.sh --skip-workspace --skip-state {{.CLI_ARGS}}

  test:state:
    desc: Run state operations load test
    cmds:
      - |
        if [ ! -f "run_all_tests.sh" ]; then
          printf 'Error: run_all_tests.sh not found\n' >&2
          exit 1
        fi
        if [ -f ".env" ]; then
          set -a
          . .env
          set +a
        fi
        if [ -f "venv/bin/activate" ]; then
          . venv/bin/activate
        fi
        chmod +x run_all_tests.sh
        MAX_CONCURRENT_RUNS="${MAX_CONCURRENT_RUNS:-20}" ./run_all_tests.sh --skip-workspace --skip-run {{.CLI_ARGS}}

  test:sentinel:
    desc: Run Sentinel policy evaluation load test
    cmds:
      - |
        if [ ! -f "examples/run_sentinel_policy_test.sh" ]; then
          printf 'Error: examples/run_sentinel_policy_test.sh not found\n' >&2
          exit 1
        fi
        if [ -f ".env" ]; then
          set -a
          . .env
          set +a
        fi
        if [ -f "venv/bin/activate" ]; then
          . venv/bin/activate
        fi
        chmod +x examples/run_sentinel_policy_test.sh
        MAX_CONCURRENT_RUNS="${MAX_CONCURRENT_RUNS:-5}" ./examples/run_sentinel_policy_test.sh {{.CLI_ARGS}}