name: tfe-load-testing

services:
  postgres:
    image: docker.io/library/postgres:15
    environment:
      POSTGRES_DB: ${TFE_DATABASE_NAME}
      POSTGRES_USER: ${TFE_DATABASE_USER}
      POSTGRES_PASSWORD: ${TFE_DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TFE_DATABASE_USER} -d ${TFE_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-02-21T16-00-46Z
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until /usr/bin/mc alias set demo http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        /usr/bin/mc mb --ignore-existing demo/${TFE_OBJECT_STORAGE_S3_BUCKET}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  tfe:
    image: ${TFE_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    security_opt:
      - label=disable
    environment:
      TFE_LICENSE: ${TFE_LICENSE}
      TFE_HOSTNAME: ${TFE_HOSTNAME}
      TFE_HTTP_PORT: "8080"
      TFE_HTTPS_PORT: "8443"
      TFE_ENCRYPTION_PASSWORD: ${TFE_ENCRYPTION_PASSWORD}
      TFE_OPERATIONAL_MODE: external
      TFE_DATABASE_USER: ${TFE_DATABASE_USER}
      TFE_DATABASE_PASSWORD: ${TFE_DATABASE_PASSWORD}
      TFE_DATABASE_HOST: postgres:5432
      TFE_DATABASE_NAME: ${TFE_DATABASE_NAME}
      TFE_DATABASE_PARAMETERS: ${TFE_DATABASE_PARAMETERS}
      TFE_OBJECT_STORAGE_TYPE: s3
      TFE_OBJECT_STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      TFE_OBJECT_STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      TFE_OBJECT_STORAGE_S3_REGION: ${TFE_OBJECT_STORAGE_S3_REGION}
      TFE_OBJECT_STORAGE_S3_BUCKET: ${TFE_OBJECT_STORAGE_S3_BUCKET}
      TFE_OBJECT_STORAGE_S3_ENDPOINT: http://minio:9000
      TFE_OBJECT_STORAGE_S3_FORCE_PATH_STYLE: "true"
      TFE_OBJECT_STORAGE_S3_USE_INSTANCE_PROFILE: "false"
      TFE_TLS_CERT_FILE: /etc/ssl/private/terraform-enterprise/cert.pem
      TFE_TLS_KEY_FILE: /etc/ssl/private/terraform-enterprise/key.pem
      TFE_TLS_CA_BUNDLE_FILE: /etc/ssl/private/terraform-enterprise/bundle.pem
      TFE_IACT_SUBNETS: ${TFE_IACT_SUBNETS}
      TFE_RUN_PIPELINE_DOCKER_EXTRA_HOSTS: ${TFE_HOSTNAME}:${TFE_HOST_ALIAS_IP}
    extra_hosts:
      - "${TFE_HOSTNAME}:${TFE_HOST_ALIAS_IP}"
    ports:
      - "${TFE_HTTPS_PORT:-443}:8443"
      - "8800:8800"
    read_only: true
    tmpfs:
      - /tmp:mode=01777
      - /run
      - /var/log/terraform-enterprise
    volumes:
      - type: bind
        source: ${PODMAN_SOCKET}
        target: /run/docker.sock
      - type: bind
        source: ./certs
        target: /etc/ssl/private/terraform-enterprise
      - type: volume
        source: terraform-enterprise-cache
        target: /var/cache/tfe-task-worker/terraform

  prometheus:
    image: docker.io/prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - tfe

  grafana:
    image: docker.io/grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  tfe-exporter:
    image: docker.io/library/python:3.11-slim
    command: python /app/tfe_exporter.py
    environment:
      - TFE_HOSTNAME=${TFE_HOSTNAME}
      - TFE_INTERNAL_HOSTNAME=tfe
      - TFE_INTERNAL_PORT=8443
      - TFE_TOKEN=${TFE_TOKEN}
      - TFE_ORGANIZATION=${TFE_ORGANIZATION}
      - EXPORTER_PORT=9101
    ports:
      - "9101:9101"
    volumes:
      - ./monitoring/tfe_exporter.py:/app/tfe_exporter.py:ro
      - ./monitoring/requirements.txt:/app/requirements.txt:ro
    working_dir: /app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install --no-cache-dir -r requirements.txt
        python tfe_exporter.py
    depends_on:
      - tfe

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${TFE_DATABASE_USER}:${TFE_DATABASE_PASSWORD}@postgres:5432/${TFE_DATABASE_NAME}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
    pid: host

volumes:
  minio-data:
  postgres-data:
  terraform-enterprise-cache:
  prometheus-data:
  grafana-data:
